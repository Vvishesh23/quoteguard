[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quoteguard"
version = "0.3.0"
readme = "README.md"
description = "Level-1 crypto order flow and trade-conditioned adverse selection research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "matplotlib>=3.8,<4", "websockets>=13,<16"]

[project.optional-dependencies]
system-trust = ["truststore>=0.10,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
quoteguard = "quoteguard.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["quoteguard*"]
